<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javelot U18 Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎯 Javelot U18 Finder</h1>
        <p>Trouve tes compétitions Cadet 2 dans toute la France</p>
        <div class="nav-buttons">
            <button id="btnSearchTab" class="tab-btn active" onclick="showTab('search')">🔍 Recherche</button>
            <button id="btnFavTab" class="tab-btn" onclick="showTab('favs')">⭐ Mon Calendrier (<span id="favCount">0</span>)</button>
        </div>
    </header>

    <main id="searchSection">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Entre un département (ex: 18) ou une ville...">
            <button id="searchBtn">Rechercher</button>
        </div>
        <div id="results"></div>
    </main>

    <main id="favsSection" style="display: none;">
        <h2>📅 Mon Calendrier de Compétitions</h2>
        <div id="favResults"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
